---
# For configurations options and examples, please seee:
# https://gethomepage.dev/configs/services/

- Home:
    - Memos:
        icon: memos.png
        href: https://memos.nxbin.xyz
        ping: memos.nxbin.xyz
        description: My social X be like
    - Todo:
        icon: si-vikunja-#196AFF
        href: https://todo.nxbin.xyz
        ping: todo.nxbin.xyz
        description: My todo list page
    - Library:
        icon: calibre-web.png
        href: https://library.nxbin.xyz
        ping: library.nxbin.xyz
        description: My library

- Productive:
    - Vikunja:
        icon: si-vikunja
        widget:
          type: vikunja
          url: http://vikunja:3456
          key: "{{HOMEPAGE_VAR_VIKUNJA_KEY}}"
          enableTaskList: true 
          version: 2 

- Others:
    - Calendar:
        icon: mdi-calendar 
        widget:
          type: calendar
          firstDayInWeek: sunday 
          view: monthly 
          maxEvents: 10 
          showTime: true 
          timezone: America/Caracas 
    - Yourspotify:
        icon: mdi-spotify
        widget:
          type: yourspotify
          url: http://yourspotify_server:8080 
          key: "{{HOMEPAGE_VAR_YOURSPOTIFY_KEY}}"
          interval: month 

