name: Check code


on:
  pull_request:
    branches:
      - main



jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

